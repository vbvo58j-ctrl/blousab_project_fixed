name: blousab
description: تطبيق بلوساب للتواصل المحلي دون إنترنت عبر Bluetooth Classic والشبكة المحلية.
publish_to: 'none'
version: 1.1.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.0
  url_launcher: ^6.3.2
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_compress: ^3.1.3
  flutter_local_notifications: ^17.2.4
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
